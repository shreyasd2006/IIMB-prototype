<article class="pp" data-person>
  <header class="pp-hero" data-manual>
    <div class="wrap pp-hero-in">
      <figure class="pp-portrait" data-pp-portrait></figure>
      <div class="pp-id">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="faculty.html">Faculty</a><span aria-hidden="true">/</span><a data-pp-area-crumb href="faculty.html"></a></nav>
        <h1 class="pp-name" data-pp-name></h1>
        <p class="pp-title" data-pp-title></p>
        <ul class="pp-areas" data-pp-areas></ul>
        <ul class="pp-roles" data-pp-roles></ul>
        <div class="pp-contact" data-pp-contact></div>
      </div>
    </div>
  </header>
  <div class="wrap pp-body">
    <section class="pp-summary" aria-labelledby="pps-h">
      <h2 class="sr" id="pps-h">Profile</h2>
      <div class="pp-lede" data-pp-summary data-fade></div>
      <p class="src" data-pp-src></p>
    </section>
    <aside class="pp-side" data-pp-side></aside>
  </div>
  <section class="section pp-pubs on-white" aria-labelledby="ppp-h" data-pp-pubs-sec>
    <div class="wrap grid">
      <h2 class="h2 pp-pubs-h" id="ppp-h" data-split>Selected publications</h2>
      <ol class="pp-publist" data-pp-pubs></ol>
    </div>
  </section>
  <section class="section pp-news" aria-labelledby="ppn-h" data-pp-news-sec hidden>
    <div class="wrap">
      <h2 class="h2" id="ppn-h" data-split>In the news</h2>
      <div class="pp-newslist" data-pp-news></div>
    </div>
  </section>
  <section class="section pp-col on-burgundy" aria-labelledby="ppc-h">
    <div class="wrap">
      <div class="pp-col-head"><h2 class="h2" id="ppc-h" data-pp-col-h></h2><p class="small mute">Drag or scroll the row.</p></div>
    </div>
    <ul class="rail pp-rail" data-pp-col data-overflow-ok></ul>
    <nav class="wrap pp-pager" aria-label="Previous and next profiles" data-pp-pager></nav>
  </section>
</article>
